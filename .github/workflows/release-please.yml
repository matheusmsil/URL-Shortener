name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A personal access token instead of GITHUB_TOKEN: PRs opened with
      # GITHUB_TOKEN don't trigger workflows, so the required checks would
      # never run on the release PR and the ruleset would block it.
      - uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
